<!DOCTYPE html>
<html>
<head>
  <title>Text Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Text Summarizer</a>
  </div>
</nav>


  <div class="container mt-5 p-4 bg-light rounded shadow">
    <h2 class="mb-4">Upload Text, PDF, or Image File</h2>
    <form method="POST" enctype="multipart/form-data">
      <textarea name="text" rows="6" class="form-control mb-3" placeholder="Or paste your text here..."></textarea>
      <input type="file" name="file" class="form-control mb-3">
      <button type="submit" class="btn btn-success">Summarize</button>
    </form>

    {% if summary %}
      <hr>
      <h4 class="mt-4">Summary:</h4>
      <p>{{ summary }}</p>
    {% endif %}
  </div>
</body>
</html>
